[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --tb=short
    --strict-markers
    --reuse-db
    --create-db
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    v2_permission: V2 权限相关测试
    idor: 跨部门 IDOR 集成测试
