[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --tb=short
    --strict-markers
    # 2026-10-21 卡 B4: 原先同时写了 `--reuse-db` 与 `--create-db` —— 两者语义冲突,
    #   `--create-db` 生效 → **每次整跑都重建测试库**, 实测整跑耗时从 106s 涨到 423s
    #   (4 倍), 且重建期间并发跑另一个 pytest 会互相抢库, 产生大量假失败/假 error
    #   (本仓 apps/django/run_expr_guard_in_window.py 这类工具就是为绕开该问题而写的)。
    #   现只保留 `--reuse-db`: pytest-django 复用库但**仍会执行 migrate** 补齐待应用迁移,
    #   故 schema 新鲜度不依赖它; 迁移与模型的一致性由 CI 的 migration-drift job
    #   (`makemigrations --check --dry-run`) 单独把守。
    --reuse-db
    # 2026-10-21: 本仓装了 pytest-randomly → **每次整跑的用例顺序都不同**。
    #   后果: 部分迁移类用例 (test_migrate_0026/0028、test_seed_v2) 对库内残留状态敏感,
    #   换个顺序就可能假失败 —— 同一份代码连跑三次, 失败集合会变。
    #   因此: (a) 复现问题时用 `-p no:randomly` 固定顺序;
    #        (b) 判定「是不是我这次改动引入的失败」必须 A/B 对照 ——
    #           git stash 掉改动跑一遍同一命令, 对比 FAILED 集合, 不要凭单次跑下结论;
    #        (c) 断言「某个用户的某组数据」的用例不要用 UserFactory ——
    #           它的 username 是进程内 Sequence + django_get_or_create, 跨测试文件会撞名,
    #           返回别人的用户, 把别的用例留下的行算进来 → 随机失败。
    #           改用 create_user(username=带 uuid 的唯一值)。
    # 2026-10-01 P2-4 收尾: WorkBuddy sandbox shim 会拦截 mkdir /private/var/folders/.../pytest-of-root
    # 报 PermissionError(EEXIST), 导致 7 个测试在 fixture setup 阶段 erroring (环境伪失败, 非代码回归)。
    # 2026-10-21 整跑 flaky 根因治理: 原先在此写死 `--basetemp=/tmp/ats_pytest_bt`。
    # 固定路径有个更隐蔽的坑: pytest 的 `_ensure_relative_to_basetemp` 对**已存在**的
    # basetemp 会先 `rm_rf` 再 `mkdir` → 沙箱拦删除 → PermissionError →
    # 所有用 tmp_path 的用例在 setup 阶段整片 error (实测一次整跑 12 例)。
    # 现改为由根 conftest 的 `pytest_configure` 提供**每轮唯一**的 /tmp 子目录
    # (见 apps/django/conftest.py): 只需新建、不需删旧, 并发的两轮整跑也互不覆盖。
# 2026-08-03 R7 (寇豆码): 原值 `tests` 只收集 apps/django/tests/ 下 60 个用例,
# apps/*/tests/ 下 127 个用例 (含全部 V2 权限 / IDOR / scope 回归) 从未被
# 收集, 也从未在 CI 跑过 —— 权限改动完全没有护栏.
# 放开为 `tests apps` 后全量收集。
# 用例基线**不在此硬编码**（2026-10-21 卡 G6 修正）：此前记的 2256 已过期好几个数量级，
# 而本仓库仍在持续加用例，写死数字必然很快又失真。改为只指向单一事实源：
# 见 .github/workflows/ci.yml 的 "Report test count" 步骤（每次 CI 产出真实收集数）。
testpaths = tests apps
# 2026-10-01 P2-4: 不再 blanket ignore DeprecationWarning —— 原配置会静默吞掉所有
# 弃用告警 (含 django-fsm 迁移前的 3.x 告警、第三方库 API 废弃信号), 让"技术债告警"
# 永远不可见。改为 default: 告警仍捕获但不失败, CI 日志可观测, 便于定向清理。
# 若未来要彻底清零, 再对具体模块用 `ignore::DeprecationWarning:mod` 精准豁免。
filterwarnings =
    default::DeprecationWarning
    default::PendingDeprecationWarning
markers =
    v2_permission: V2 权限相关测试
    idor: 跨部门 IDOR 集成测试
    # 2026-10-08: 隔离区 marker。替代原先由 GitHub 仓库级 QUARANTINE 环境变量
    #   承载的 --deselect 名单 —— 那份名单**不在代码库内**, 无法 review、无法审计,
    #   9 条里已自愈的会被无限期静默跳过 (本项目第二次踩这个坑)。
    #   现在: 给用例打 @pytest.mark.quarantine, CI 用 `-m "not quarantine"` 排除,
    #   并由 tests/test_quarantine_guard.py 做双向守卫 (见该文件)。
    quarantine: 隔离区用例(已知失败, 待修); 由 tests/test_quarantine_guard.py 双向守卫
