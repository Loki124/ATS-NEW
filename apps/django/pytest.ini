[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --tb=short
    --strict-markers
    --reuse-db
    --create-db
# 2026-08-03 R7 (寇豆码): 原值 `tests` 只收集 apps/django/tests/ 下 60 个用例,
# apps/*/tests/ 下 127 个用例 (含全部 V2 权限 / IDOR / scope 回归) 从未被
# 收集, 也从未在 CI 跑过 —— 权限改动完全没有护栏.
# 放开为 `tests apps` 后全量 ~187 用例进入收集范围.
testpaths = tests apps
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    v2_permission: V2 权限相关测试
    idor: 跨部门 IDOR 集成测试
