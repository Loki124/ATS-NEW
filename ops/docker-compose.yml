version: '3.8'

# Fix 12:
#   - MySQL 改 expose (docker 网络内可达) 而非 ports (host 不可达)
#   - 移除弱默认密码 ${VAR:-change-me} ; env 缺失时启动失败而非用 weak default
#   - Backend 端口同样改 expose, 仅 nginx 暴露 host 端口

services:
  mysql:
    image: mysql:8.0
    container_name: ats-mysql
    restart: unless-stopped
    environment:
      # 没有默认值. .env 必须提供这些变量, 否则 docker compose 拒绝启动
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 必须设置 (32+ 字符随机串)}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE 必须设置, 如 ats_pro}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER 必须设置, 如 ats_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 必须设置 (32+ 字符随机串)}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      # Fix 12: 仅监听 docker 网络, 不监听 0.0.0.0 (防 docker 网络外扫描)
      - --bind-address=0.0.0.0
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - ats-network

  backend:
    # 2026-06-29 花无缺: 拍平后 backend 在 apps/django/ (不是 ./backend/), Dockerfile 也搬了
    build:
      context: ../apps/django
      dockerfile: Dockerfile
    expose:
      - "5125"
    environment:
      - DATABASE_URL=mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET 必须设置 (32+ 字符)}
      - INTEGRATION_FERNET_KEY=${INTEGRATION_FERNET_KEY:?INTEGRATION_FERNET_KEY 必须设置 (Fernet base64)}
      - DJANGO_SETTINGS_MODULE=config.settings.prod
      - PORT=5125
      - CORS_ORIGIN=${CORS_ORIGIN:?CORS_ORIGIN 必须设置, 如 https://ats.example.com}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS 必须设置, 如 ats.example.com}
      - MYSQL_HOST=mysql
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ats-network

  nginx:
    image: nginx:alpine
    ports:
      # 唯一对外暴露: HTTPS/TLS 在 nginx 或 CF Tunnel 终止
      - "9908:80"
    volumes:
      - ../../web/app/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../web/app/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - ats-network
    restart: unless-stopped

networks:
  ats-network:
    driver: bridge

volumes:
  mysql_data: