# =============================================================================
# ATS-NEW 生产部署编排 (1Panel: 容器 → 编排 → 创建编排, 导入本文件)
#
# 流量拓扑:
#   cloudflared(服务器上独立运行, 外部) → http://localhost:9908
#     → nginx:80 → { /api/ → backend:8000(WSGI) | /ws/ → asgi:8001(daphne/WS)
#                    | /static/ → backend:8000(whitenoise) | / → SPA }
#   celery-worker / celery-beat: 异步任务 (与 backend 共享同一镜像)
#   mysql + redis: 数据层 (仅 docker 网络内可达, 不暴露主机端口)
#
# 前端在 compose 内构建 (web/app/Dockerfile, 已修复 nginx.conf 引用)。
# 依赖本目录 ops/.env, 缺失变量 compose 直接拒绝启动。
# =============================================================================

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_DEBUG: "False"
  PORT: "8000"
  DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?DJANGO_SECRET_KEY 必须设置 (python -c "import secrets;print(secrets.token_urlsafe(64))")}
  INTEGRATION_FERNET_KEY: ${INTEGRATION_FERNET_KEY:?INTEGRATION_FERNET_KEY 必须设置 (openssl rand -base64 32)}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-${INTEGRATION_FERNET_KEY}}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS 必须设置, 如 https://ats.example.com}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?DJANGO_ALLOWED_HOSTS 必须设置, 如 ats.example.com,www.ats.example.com}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  MYSQL_HOST: mysql
  MYSQL_USER: ${MYSQL_USER}
  MYSQL_PASSWORD: ${MYSQL_PASSWORD}

services:
  mysql:
    image: mysql:8.0
    container_name: ats-mysql
    restart: unless-stopped
    environment:
      # 无默认值, 缺失 compose 直接拒绝启动
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 必须设置 (32+ 字符随机串)}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE 必须设置, 如 ats_pro}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER 必须设置, 如 ats_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 必须设置 (32+ 字符随机串)}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
      - --bind-address=0.0.0.0
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - ats-network

  redis:
    image: redis:7-alpine
    container_name: ats-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks:
      - ats-network

  backend:
    # WSGI (gunicorn) — 处理 /api/ 与静态资源
    build:
      context: ../apps/django
      dockerfile: Dockerfile
    image: ats-backend
    container_name: ats-backend
    restart: unless-stopped
    # 启动先 migrate + collectstatic, 再起 gunicorn; 任一失败重试 30 次等 mysql 就绪
    command:
      - sh
      - -c
      - |
        set -e
        for i in $$(seq 1 30); do
          if python manage.py migrate --noinput && python manage.py collectstatic --noinput; then
            echo "[init] migrate+collectstatic OK on attempt $$i"
            exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --worker-class sync --timeout 60 --graceful-timeout 30 --max-requests 1000 --max-requests-jitter 100 --access-logfile - --error-logfile -
          fi
          echo "[init] attempt $$i failed, retrying in 3s..."
          sleep 3
        done
        echo "[init] FAILED after 30 attempts"
        exit 1
    expose:
      - "8000"
    environment:
      <<: *backend-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ats-network

  asgi:
    # ASGI (daphne) — 处理 /ws/ WebSocket (Channels)
    build:
      context: ../apps/django
      dockerfile: Dockerfile
    image: ats-backend
    container_name: ats-asgi
    restart: unless-stopped
    command:
      - daphne
      - -b
      - "0.0.0.0"
      - -p
      - "8001"
      - --proxy-headers
      - config.asgi:application
    expose:
      - "8001"
    environment:
      <<: *backend-env
      PORT: "8001"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - ats-network

  celery-worker:
    build:
      context: ../apps/django
      dockerfile: Dockerfile
    image: ats-backend
    container_name: ats-celery-worker
    restart: unless-stopped
    command: celery -A celery_app worker -l info
    environment:
      <<: *backend-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - ats-network

  celery-beat:
    build:
      context: ../apps/django
      dockerfile: Dockerfile
    image: ats-backend
    container_name: ats-celery-beat
    restart: unless-stopped
    command: celery -A celery_app beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      <<: *backend-env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      - ats-network

  nginx:
    # 前端在 compose 内构建 (node build → nginx 服务 dist)
    build:
      context: ../web/app
      dockerfile: Dockerfile
    container_name: ats-nginx
    ports:
      # 唯一对外主机端口; cloudflared(外部) 指向 http://localhost:9908
      - "9908:80"
    depends_on:
      - backend
      - asgi
    restart: unless-stopped
    networks:
      - ats-network

networks:
  ats-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
