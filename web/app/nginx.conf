server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # 2026-08-03 R4 (寇豆码): 原来是 backend:5125, 但后端容器 gunicorn
        # 一直是 --bind 0.0.0.0:8000 (apps/django/Dockerfile:83), 5125 从来没人监听,
        # 整个 /api/ 反代必然 502。统一到 8000。
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # prod.py:70 SECURE_PROXY_SSL_HEADER 依赖这个头判断原始协议
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (Channels / 通知推送) 走同一后端, 需要 Upgrade 头透传
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
