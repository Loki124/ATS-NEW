server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 前端 Vite 生产构建产物 (base='/static/'):
    #   - JS/CSS hashed chunks 实际输出在 dist/assets/, 对应 URL /static/assets/
    #   - public/ 下文件 (vite.svg 等) 实际输出在 dist/, 对应 URL /static/
    # 先由 nginx 本地直出; 找不到的文件 (Django admin / DRF static) fallback 到 backend.
    location /static/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        alias /usr/share/nginx/html/;
        try_files $uri $uri/ @django_static;
    }

    location @django_static {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API → WSGI (gunicorn)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # prod.py SECURE_PROXY_SSL_HEADER 依赖此头判断原始协议 (CF Tunnel 透传)
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket (Channels) → ASGI (daphne)
    location /ws/ {
        proxy_pass http://asgi:8001/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
