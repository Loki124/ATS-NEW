name: ATS CI

# R11 (2026-08-03 寇豆码): 这套 CI 之前是"看起来在跑, 实际拦不住任何东西":
#   1. 后端只跑 `pytest tests/` = 77/204 个用例, 62% 的测试 (apps/*/tests/) 从不执行
#   2. 前端用 `build:nocheck` 跳过 vue-tsc, 类型错误直接进主干
#   3. `npm run lint || true` —— lint 挂了也当过
#   4. Trivy `exit-code: '0'` —— 扫出 CRITICAL 漏洞也当过
#   本次把这 4 处全部收紧成真实门禁。

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        # 2026-09-27 P1-7: 与生产对齐为 MySQL 8.x —— mysql:9 与 8 在排序规则、
        # JSON 函数等行为上存在差异, CI 跑 9 而生产跑 8 会让"CI 绿、生产炸"。
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ats_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            apps/django/requirements.txt
            apps/django/requirements-dev.txt

      - name: Install backend deps
        working-directory: apps/django
        run: |
          python -m venv .venv
          . .venv/bin/activate
          # R9: pytest / pytest-django / pytest-cov 现在锁在 requirements-dev.txt 里,
          #     不再像以前那样在 CI 里裸 `pip install pytest` 拉不确定版本。
          pip install -r requirements-dev.txt

      # R11: 原来是 `pytest tests/`, 只覆盖 77/204 个用例 —— apps/*/tests/ 下的
      #      127 个用例 (权限 V2、字段 ACL、状态机等核心逻辑) 在 CI 里从来没跑过。
      #      改成全量收集 (pytest.ini 的 testpaths = tests apps), 隔离区单独排除。
      - name: Lint (ruff)
        working-directory: apps/django
        run: |
          . .venv/bin/activate
          # 2026-10-08 (#27): Python lint 门禁。规则集见 apps/django/ruff.toml。
          #   阶段一聚焦 bug-catcher (F/E9/I), 非零即失败, 防"只许减少、不许新增"。
          ruff check apps

      # 2026-10-09 (#43): 技术债注释扫描。规范: TODO/FIXME/HACK/XXX 必须带 #issue 编号,
      #   否则不可审计、等于永久没人跟。当前 warn-only (报告但不阻断), 待存量裸标记补完
      #   编号后翻 --strict 成硬门禁 (与 ruff 同源: 只许减少、不许新增)。
      - name: Tech-debt TODO scan (warn-only)
        working-directory: apps/django
        run: |
          . .venv/bin/activate
          python scripts_scan_todo.py

      # 2026-10-21 (整改卡 B6): 把「权限写口」扫描脚本接进 CI —— **硬门禁**。
      #   扫描器 (卡 A3 修完结构盲区后) 会列出两类缺口:
      #     ① 写操作(POST/PUT/PATCH/DELETE)未声明任何权限码的视图;
      #     ② 单码声明视图的**派生写码**(:create/:edit/:delete)未在 permission_resources
      #        注册 —— 这种情况下 V2Permission 会回退到读码校验, 等于「持 :list 的账号
      #        可执行写操作」= P0 权限提升。
      #   脚本有缺口时 exit 1 → 直接阻断合并。
      #   码集合取「DB ∪ seed」双源并集（DB 未 migrate 时也能给出正确判定）。
      - name: V2 write-permission guard (hard gate)
        working-directory: apps/django
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DB_ENGINE: mysql
          DB_NAME: ats_test
          DB_USER: root
          DB_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
        run: |
          . .venv/bin/activate
          python scripts_scan_v2_write_guard.py

      # 2026-10-21 (整改卡 B6): 软删过滤扫描 —— **warn-only 观察期**。
      #   报出「对没有 deleted_at 字段的模型做软删过滤」的调用点（脏数据来源）。
      #   脚本当前恒 exit 0（只报告不阻断）；待存量调用点收口后再翻成硬门禁。
      - name: Soft-delete filter scan (warn-only)
        working-directory: apps/django
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DB_ENGINE: mysql
          DB_NAME: ats_test
          DB_USER: root
          DB_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
        run: |
          . .venv/bin/activate
          python scripts_scan_softdelete.py

      # 2026-10-21 (整改卡 D3): 软删**泄漏** ViewSet 扫描 —— **hard gate**。
      #   与上一步方向相反: 报出「模型有 deleted_at, 但 ViewSet 的 queryset 不过滤」
      #   的调用点 —— 即「删了还在列表里」。D3 结构性修复后实测 0 处, 可直接当硬门禁,
      #   防止以后新增模型/ViewSet 时重新漏掉 (基类已挂 SoftDeleteManager, 漏的是
      #   自定义 manager / 绕过默认 manager 的写法)。
      - name: Soft-delete leak scan (hard gate)
        working-directory: apps/django
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DB_ENGINE: mysql
          DB_NAME: ats_test
          DB_USER: root
          DB_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
        run: |
          . .venv/bin/activate
          python scripts_scan_softdelete_viewsets.py --strict

      # 2026-10-21 整跑 flaky 根因治理: 禁**模块级** django_db(transaction=True)。
      #   模块级事务标记 → 该文件每个用例 teardown 都 flush 整库 → 抹掉已提交种子
      #   → 字典序在后的用例批量 403（整跑失败集合逐轮不同的主因之一）。
      #   方法级装饰器不受影响；确需模块级的必须先在脚本的 KNOWN_EXCEPTIONS 登记理由。
      - name: Module-level transaction marker scan (hard gate)
        working-directory: apps/django
        run: |
          . .venv/bin/activate
          python scripts_scan_module_level_transaction.py --strict

      - name: Run tests (full suite, quarantine excluded)
        working-directory: apps/django
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          # 2026-10-08 (#26): 测试库对齐生产 MySQL 8 —— 复用上方 mysql:8.0 service,
          #   不再跑 SQLite (避免 "CI 绿、生产炸" 的排序规则/JSON 函数差异)。
          DB_ENGINE: mysql
          DB_NAME: ats_test
          DB_USER: root
          DB_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          # 2026-10-08: 后端覆盖率门禁 (见 #25)。低于此值 CI 失败。
          #   阈值保守设 70, 后续随补齐率提升再上调。
          COV_MIN: '70'
        run: |
          . .venv/bin/activate
          # 2026-10-08: 隔离名单不再由仓库级 QUARANTINE 变量承载 (不可审计),
          #   改为代码内 pytest marker: 给用例打 @pytest.mark.quarantine 即可隔离。
          #   tests/test_quarantine_guard.py 会守卫"名单里的用例是否仍真的失败"。
          #   .coveragerc 负责 source=apps 与排除 migrations/tests, 故这里只传 --cov=apps。
          pytest --tb=short -v --maxfail=10 -m "not quarantine" --cov=apps \
            --cov-report=term-missing --cov-fail-under=${{ env.COV_MIN }}

      - name: Report test count (single source of truth)
        if: always()
        working-directory: apps/django
        run: |
          . .venv/bin/activate
          # 2026-10-09 (#41): pytest 收集基线作为测试数字单一事实源，由 CI 产出，避免文档口径互相矛盾。
          COUNT=$(pytest --co -q 2>/dev/null | grep -c '::' || true)
          echo "::notice title=pytest::collected ${COUNT} tests (single source of truth)"

  test-frontend:
    name: Frontend Build + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/app/package-lock.json

      - name: Install frontend deps
        working-directory: web/app
        run: npm ci

      # R10 + R11: 原来是 build:nocheck, 直接跳过 vue-tsc —— 类型检查等于没有。
      #   R10 已把仓库里那 3 个类型错误修掉, 这里恢复成带 vue-tsc 的正式 build。
      - name: Type check + Build
        working-directory: web/app
        run: npm run build

      # 2026-10-08 (#25): 前端覆盖率门禁。vitest.config.ts 里设了 thresholds,
      #   低于阈值本条直接失败。html 报告落 artifact 供复盘。
      - name: Unit tests (with coverage gate)
        working-directory: web/app
        run: npm test -- --coverage

      # R11: 原来是 `npm run lint || true`, 挂了也当过。
      #   现已确认全仓 eslint 零 error 零 warning, 直接收成硬门禁。
      #   用 lint:ci (不带 --fix): CI 里自动改文件会让"本地干净、CI 也绿, 但改动没提交"
      #   这种幽灵状态发生。
      - name: Lint
        working-directory: web/app
        run: npm run lint:ci

      # X-04 / X-05 / X-13 令牌强制门禁（AGENTS.md §6.2）。
      # 2026-10-21 (整改卡 E1-c): 已翻**硬门禁**（.stylelintrc.json defaultSeverity=error）。
      #   落地顺序不可反: 先修插件盲区（var(--token, #hex) 的 fallback 曾整体逃逸检测,
      #   实测修好后暴露 79 处）→ 再把存量 88 处硬编码色收敛到设计令牌 → 最后翻 severity。
      #   现在 lint:style 有任何命中即 exit 1, 阻断合并。
      #
      # X-20 卡片禁止左侧边框线保持 error（该规则在 .stylelintrc.json 里显式
      # severity=error，命中即阻断合并；非卡片场景须在插件 ALLOWLIST 登记原因）。
      - name: Style lint (X-04/X-05/X-13/X-20 hard gate)
        working-directory: web/app
        run: npm run lint:style

  brand-tokens:
    # R-214：品牌色令牌 MUST 由 brand-tokens.mjs 生成并纳入 CI 门禁。
    # 任一失败（彩度过低 / 对比度不达标 / 已提交文件过期）直接阻断合并。
    name: Brand Tokens Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/app/package-lock.json

      - name: Install frontend deps
        working-directory: web/app
        run: npm ci

      - name: Generate + gate brand tokens
        working-directory: web/app
        env:
          BRAND_COLOR: ${{ vars.BRAND_COLOR }}
        run: node brand-tokens.mjs --brand "${BRAND_COLOR:-#6366F1}" --ci --out src/styles/brand-tokens.css

  token-docs:
    # 令牌真源是 web/app/src/styles/tokens.css (L0)。AGENTS.md 与 docs/04-ui 下的
    # 规范文档 MUST 只引用令牌名, MUST NOT 复制数值 —— 否则 AI 照文档写的 CSS 变量
    # 不存在, 静默失效 (2026-10-18 实际发生: AGENTS.md 写 --color-success/#EF4444/
    # data-theme, 真实是 --c-success/#C62828/body.dark)。
    # 见 docs/04-ui/UI_DOC_AUDIT_2026-10-18.md
    #
    # 纯 Node 脚本无外部依赖, 故无需 npm ci, 直接跑。
    # ✅ 2026-10-19 存量已清零并转为**强制阻断**（此前 continue-on-error 观察期结束）。
    #    清零过程: 修 scripts/token-doc-audit.mjs 两处解析盲区（通配 `--g*` 被截成
    #    `--g` 误报悬空、行内连列 `/` 分隔符残留导致虚假漂移），并把 UI_DESIGN_SPEC
    #    §2.7 / §3 的「复制数值」改为只引用令牌名。
    name: Token Doc Consistency Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit design-token references in docs
        run: node scripts/token-doc-audit.mjs

  ui-render-scope:
    # 2026-10-22: scoped→h() 失效样式的**新增**阻断门禁。
    #
    # 事故背景: Vue 的 scoped 样式依赖编译期给模板元素注入 data-v-xxx,
    #   而表格列 render 里用 h() 造的 VNode 不带该属性 → scoped 规则**完全不命中**。
    #   症状极具迷惑性: 源码规则完全正确、lint/编译/单测全绿, 渲染却是裸的
    #   (实测两行日期被排成两列、图标越出高亮块 → **连续三轮改 CSS 都没生效**)。
    #   这类缺陷没有任何静态类型信号, 只能靠专门的结构扫描兜住。
    #
    # 为什么是「只拦新增」而不是全量阻断:
    #   存量 32 处是既有遗留 (设置中心若干页 + DemandList + GlobalSearch 等),
    #   直接全量阻断会让流水线立刻全红、无法合并。基线机制与仓库既有门禁同源
    #   (见 apps/django/scripts_scan_todo.py、ruff 门禁的「只许减少、不许新增」思路):
    #   存量登记进 scripts/render-scope-baseline.txt 放行, CI 只拦**新增**。
    #   存量清完后把基线清空即自动变严格门禁。
    #
    # ⚠️ 扫描器必须用真浏览器实测校准过 (2026-10-22):
    #   规则选择器实测为 .saturation-cell[data-v-ba9f44de], 而元素上**无任何 data-v 属性**
    #   → 确认不命中。判据须用**非继承属性** —— font-variant-numeric 是继承属性,
    #   computed 里看着"生效了"其实是父级 .n-data-table-table 继承来的假阳性。
    name: UI Render-Scope Gate (block new scoped→h() breakage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/app/package-lock.json

      - name: Install frontend deps
        working-directory: web/app
        run: npm ci

      - name: Scan scoped→h() broken styles (strict, baseline-aware)
        working-directory: web/app
        run: node scripts/check-h-render-scope.mjs --strict

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    services:
      mysql:
        # 2026-09-27 P1-7: 与生产对齐为 MySQL 8.x —— mysql:9 与 8 在排序规则、
        # JSON 函数等行为上存在差异, CI 跑 9 而生产跑 8 会让"CI 绿、生产炸"。
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ats_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache-dependency-path: apps/django/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend deps
        working-directory: apps/django
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt

      - name: Start backend (MySQL for e2e)
        working-directory: apps/django
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          # 2026-10-15: e2e 后端也统一走 MySQL (复用本 job 的 mysql:8.0 service + ats_e2e 库),
          #   不再用 SQLite —— 避免"e2e 绿、生产炸"的引擎行为差异 (见 test.py 同款教训)。
          DATABASE_URL: mysql://root:${{ secrets.CI_MYSQL_ROOT_PASSWORD }}@127.0.0.1:3306/ats_e2e
          DJANGO_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_E2E }}
          CORS_ALLOWED_ORIGINS: http://localhost:5212
        run: |
          . .venv/bin/activate
          python manage.py migrate
          nohup python -m gunicorn config.wsgi:application --bind 127.0.0.1:8000 > /tmp/e2e-backend.log 2>&1 &
          # R11: 原来是死等 sleep 5, 机器慢一点就连不上、报一堆假失败。
          #      改成轮询 /health/ 直到真的起来, 最多等 60s, 超时把日志打出来。
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ > /dev/null 2>&1; then
              echo "✅ backend 已就绪 (第 ${i} 次探测)"
              exit 0
            fi
            sleep 2
          done
          echo "❌ backend 60s 内未就绪, 日志如下:"
          cat /tmp/e2e-backend.log
          exit 1

      - name: Install frontend deps + build
        working-directory: web/app
        # build:fast 仅做 vite 打包 (不做 vue-tsc): 类型安全已由同一流水线前置的
        # test-frontend job (npm run build = vue-tsc && vite build) 保证。
        # 原 build:nocheck 逃生口已删除, 任何生产构建都必须走带类型检查的 build。
        run: |
          npm ci
          npm run build:fast

      - name: Install Playwright browsers
        working-directory: web/app
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: web/app
        env:
          CI: true
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/app/playwright-report/
          retention-days: 7

      # 2026-10-21 (整改卡 E7): a11y 冒烟接进 CI —— 原先 e2e/a11y-smoke.mjs 恒
      # process.exit(0), R-102/R-103/R-109 三个 [R] 项永久处于"未验证"状态。
      # 现在脚本按 violations 数退出 (A11Y_MAX_VIOLATIONS), 三档视口各跑一遍。
      #
      # ⚠️ 当前为 **report-only** (A11Y_ALLOW_VIOLATIONS=1): 本地沙箱起不了 Playwright
      # (macOS Mach 端口被限制), 存量违规数无法在提交前测出 → 直接翻硬门禁会让 CI
      # 立刻全红并阻塞合并。首轮跑完拿到基线后, 删掉该 env 即自动变硬门禁。
      - name: A11y smoke (axe-core, 320/768/1200)
        working-directory: web/app
        env:
          CI: true
          BASE_URL: http://127.0.0.1:5212
          A11Y_ALLOW_VIOLATIONS: '1'
        run: |
          npx vite --host 127.0.0.1 --port 5212 > /tmp/vite-a11y.log 2>&1 &
          VITE_PID=$!
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:5212/ >/dev/null 2>&1 && break
            sleep 2
          done
          for VP in 320x640 768x1024 1200x900; do
            echo "--- viewport $VP"
            A11Y_VIEWPORT=$VP A11Y_REPORT=/tmp/ats-a11y-$VP.json npm run audit:a11y || true
          done
          kill $VITE_PID 2>/dev/null || true
          cat /tmp/ats-a11y-*.json || true

      - name: Upload a11y reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-reports
          path: /tmp/ats-a11y-*.json
          retention-days: 7

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-backend-log
          path: /tmp/e2e-backend.log
          retention-days: 7

  test-migrations:
    name: Test Migration Deploy
    runs-on: ubuntu-latest
    services:
      mysql:
        # 2026-09-27 P1-7: 与生产对齐为 MySQL 8.x —— mysql:9 与 8 在排序规则、
        # JSON 函数等行为上存在差异, CI 跑 9 而生产跑 8 会让"CI 绿、生产炸"。
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ats_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache-dependency-path: apps/django/requirements.txt

      - name: Install backend deps
        working-directory: apps/django
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt

      - name: Apply migrations (fresh DB)
        working-directory: apps/django
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DATABASE_URL: mysql://root:${{ secrets.CI_MYSQL_ROOT_PASSWORD }}@127.0.0.1:3306/ats_migration_test
          DJANGO_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_MIGRATION }}
        run: |
          . .venv/bin/activate
          python manage.py migrate
          TABLE_COUNT=$(mysql -h 127.0.0.1 -uroot -p${{ secrets.CI_MYSQL_ROOT_PASSWORD }} -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='ats_migration_test';" 2>/dev/null)
          echo "迁移后表数量: $TABLE_COUNT"
          if [ "$TABLE_COUNT" -lt 50 ]; then
            echo "❌ 表数量 < 50, 迁移失败"
            exit 1
          fi
          echo "✅ 迁移验证通过"

      - name: Verify idempotency (re-run = no-op)
        working-directory: apps/django
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DATABASE_URL: mysql://root:${{ secrets.CI_MYSQL_ROOT_PASSWORD }}@127.0.0.1:3306/ats_migration_test
          DJANGO_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_MIGRATION }}
        run: |
          . .venv/bin/activate
          python manage.py migrate
          echo "✅ 二次 migrate 幂等性验证通过"

      # R3: 校验生产 settings 的启动期强校验真的会拦住错误配置。
      #     配置缺失时必须 ImproperlyConfigured 直接崩, 而不是静默回落到 dev。
      - name: Verify prod settings rejects unsafe config
        working-directory: apps/django
        run: |
          . .venv/bin/activate
          set +e
          DJANGO_SETTINGS_MODULE=config.settings.prod \
          DJANGO_SECRET_KEY=too-short \
          DJANGO_DEBUG=True \
          python manage.py check 2>/dev/null
          if [ $? -eq 0 ]; then
            echo "❌ prod settings 接受了不安全配置 (弱 SECRET_KEY + DEBUG=True), 启动期校验失效"
            exit 1
          fi
          echo "✅ prod settings 正确拒绝了不安全配置"

  migration-drift:
    # 2026-10-15: 补上"模型改了但没生成迁移"这道闸。
    # 事故背景: 新 app 注册进 INSTALLED_APPS + 0001_initial.py 在仓, 但**从未跑 migrate**,
    #   本地全站 500 (1146 Table doesn't exist), 排查方向一度被带偏到代码 bug。
    # 为什么现有 job 拦不住:
    #   - test-backend / test-migrations 都是**全新空库**跑 migrate,
    #     全新库天然没有漂移, 查不出"改了模型没生成迁移"。
    #   - 全仓 grep: CI 此前完全没有 `makemigrations --check`。
    # 这一步本质不需要数据库（autodetector 只比对 models.py 与迁移历史状态），
    # 但为与全仓统一仍挂 mysql:8.0 service 并走 MySQL 设置，杜绝任何 SQLite 回落。
    name: Migration Drift Gate
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ats_drift
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: apps/django/requirements.txt

      - name: Install backend deps
        working-directory: apps/django
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt

      - name: makemigrations --check (模型与迁移必须一致)
        working-directory: apps/django
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DJANGO_SECRET_KEY: ci-drift-gate-placeholder-secret-key-0000
          # 统一走 MySQL（与 test-backend / e2e / test-migrations 一致），不再用 SQLite 引导；
          # makemigrations --check 只比对 models.py 与迁移状态, 不发起业务查询, 复用本 job 的 mysql service。
          DATABASE_URL: mysql://root:${{ secrets.CI_MYSQL_ROOT_PASSWORD }}@127.0.0.1:3306/ats_drift
        run: |
          . .venv/bin/activate
          # --check 语义: 有未生成的迁移就非零退出, 不会真的写盘。
          python manage.py makemigrations --check --dry-run

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # R11: 原来 exit-code: '0' —— 扫出 CRITICAL 漏洞也返回成功, 纯装饰。
      #      改成 exit-code: '1' 真阻断。ignore-unfixed 保留: 上游还没出补丁的
      #      漏洞拦了也没法修, 拦它只会逼着大家加 skip。
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
