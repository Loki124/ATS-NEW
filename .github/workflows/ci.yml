name: ATS CI

# R11 (2026-08-03 寇豆码): 这套 CI 之前是"看起来在跑, 实际拦不住任何东西":
#   1. 后端只跑 `pytest tests/` = 77/204 个用例, 62% 的测试 (apps/*/tests/) 从不执行
#   2. 前端用 `build:nocheck` 跳过 vue-tsc, 类型错误直接进主干
#   3. `npm run lint || true` —— lint 挂了也当过
#   4. Trivy `exit-code: '0'` —— 扫出 CRITICAL 漏洞也当过
#   本次把这 4 处全部收紧成真实门禁。

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # 已知历史失败用例 (隔离区 / quarantine)。
  # 这 9 个是 R7 放开测试收集后暴露出来的存量问题, 不属于 Phase 0/1 修复范围,
  # 由 known-failures 这个独立 job 持续可见地跟踪。
  # (test_id_card_takes_priority_over_phone 是 BUG-1 引入的回归, 已修复并移出隔离区)
  #
  # ⚠️ 规则: 这个清单只允许变短, 不允许变长。
  #    新写的代码挂了就必须修, 不许往这里塞。
  QUARANTINE: >-
    --deselect apps/add_candidate/tests/test_views.py::TestUploadAndParseView::test_upload_single_pdf_success
    --deselect apps/add_candidate/tests/test_views.py::TestParseStatusView::test_get_processing_job
    --deselect apps/add_candidate/tests/test_views.py::TestReplaceFileView::test_replace_success
    --deselect apps/add_candidate/tests/test_views.py::TestBulkCreateView::test_bulk_create_pending
    --deselect apps/add_candidate/tests/test_views.py::TestScoringEndpoints::test_scoring_start_returns_stream_url
    --deselect apps/add_candidate/tests/test_views.py::TestScoringEndpoints::test_scoring_stream_returns_event_stream
    --deselect apps/core/tests/test_sync_resources_t29.py::test_sync_resources_persists_codes
    --deselect apps/core/tests/test_sync_resources_t29.py::test_sync_resources_rejects_invalid_codes
    --deselect apps/core/tests/test_sync_resources_t29.py::test_sync_resources_empty_array_clears

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ats_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            apps/django/requirements.txt
            apps/django/requirements-dev.txt

      - name: Install backend deps
        working-directory: apps/django
        run: |
          python -m venv .venv
          . .venv/bin/activate
          # R9: pytest / pytest-django / pytest-cov 现在锁在 requirements-dev.txt 里,
          #     不再像以前那样在 CI 里裸 `pip install pytest` 拉不确定版本。
          pip install -r requirements-dev.txt

      # R11: 原来是 `pytest tests/`, 只覆盖 77/204 个用例 —— apps/*/tests/ 下的
      #      127 个用例 (权限 V2、字段 ACL、状态机等核心逻辑) 在 CI 里从来没跑过。
      #      改成全量收集 (pytest.ini 的 testpaths = tests apps), 隔离区单独排除。
      - name: Run tests (full suite, quarantine excluded)
        working-directory: apps/django
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          . .venv/bin/activate
          pytest --tb=short -v --maxfail=10 ${{ env.QUARANTINE }}

  known-failures:
    name: Known Failures (tracking only, non-blocking)
    runs-on: ubuntu-latest
    # 隔离区用例单独跑, 不阻断合并, 但状态一直挂在 PR 上可见 ——
    # 目的是防止"deselect 完就忘了", 修好一个就从 QUARANTINE 里删一行。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            apps/django/requirements.txt
            apps/django/requirements-dev.txt

      - name: Install backend deps
        working-directory: apps/django
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements-dev.txt

      - name: Run quarantined tests
        working-directory: apps/django
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
        run: |
          . .venv/bin/activate
          pytest --tb=short -v \
            apps/add_candidate/tests/test_views.py \
            apps/core/tests/test_sync_resources_t29.py

  test-frontend:
    name: Frontend Build + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/app/package-lock.json

      - name: Install frontend deps
        working-directory: web/app
        run: npm ci

      # R10 + R11: 原来是 build:nocheck, 直接跳过 vue-tsc —— 类型检查等于没有。
      #   R10 已把仓库里那 3 个类型错误修掉, 这里恢复成带 vue-tsc 的正式 build。
      - name: Type check + Build
        working-directory: web/app
        run: npm run build

      - name: Unit tests
        working-directory: web/app
        run: npm test

      # R11: 原来是 `npm run lint || true`, 挂了也当过。
      #   现已确认全仓 eslint 零 error 零 warning, 直接收成硬门禁。
      #   用 lint:ci (不带 --fix): CI 里自动改文件会让"本地干净、CI 也绿, 但改动没提交"
      #   这种幽灵状态发生。
      - name: Lint
        working-directory: web/app
        run: npm run lint:ci

  brand-tokens:
    # R-214：品牌色令牌 MUST 由 brand-tokens.mjs 生成并纳入 CI 门禁。
    # 任一失败（彩度过低 / 对比度不达标 / 已提交文件过期）直接阻断合并。
    name: Brand Tokens Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/app/package-lock.json

      - name: Install frontend deps
        working-directory: web/app
        run: npm ci

      - name: Generate + gate brand tokens
        working-directory: web/app
        env:
          BRAND_COLOR: ${{ vars.BRAND_COLOR }}
        run: node brand-tokens.mjs --brand "${BRAND_COLOR:-#6366F1}" --ci --out src/styles/brand-tokens.css

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ats_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache-dependency-path: apps/django/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend deps
        working-directory: apps/django
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt

      - name: Start backend (SQLite for e2e)
        working-directory: apps/django
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DATABASE_URL: sqlite:///db.sqlite3
          DJANGO_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_E2E }}
          CORS_ALLOWED_ORIGINS: http://localhost:5212
        run: |
          . .venv/bin/activate
          python manage.py migrate
          nohup python -m gunicorn config.wsgi:application --bind 127.0.0.1:8000 > /tmp/e2e-backend.log 2>&1 &
          # R11: 原来是死等 sleep 5, 机器慢一点就连不上、报一堆假失败。
          #      改成轮询 /health/ 直到真的起来, 最多等 60s, 超时把日志打出来。
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ > /dev/null 2>&1; then
              echo "✅ backend 已就绪 (第 ${i} 次探测)"
              exit 0
            fi
            sleep 2
          done
          echo "❌ backend 60s 内未就绪, 日志如下:"
          cat /tmp/e2e-backend.log
          exit 1

      - name: Install frontend deps + build
        working-directory: web/app
        # 这里用 build:nocheck 是有意的: 类型检查已经在 test-frontend job 跑过,
        # e2e 只需要产物, 不必再花一遍 vue-tsc 的时间。
        run: |
          npm ci
          npm run build:nocheck

      - name: Install Playwright browsers
        working-directory: web/app
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: web/app
        env:
          CI: true
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/app/playwright-report/
          retention-days: 7

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-backend-log
          path: /tmp/e2e-backend.log
          retention-days: 7

  test-migrations:
    name: Test Migration Deploy
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ats_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache-dependency-path: apps/django/requirements.txt

      - name: Install backend deps
        working-directory: apps/django
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt

      - name: Apply migrations (fresh DB)
        working-directory: apps/django
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DATABASE_URL: mysql://root:${{ secrets.CI_MYSQL_ROOT_PASSWORD }}@127.0.0.1:3306/ats_migration_test
          DJANGO_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_MIGRATION }}
        run: |
          . .venv/bin/activate
          python manage.py migrate
          TABLE_COUNT=$(mysql -h 127.0.0.1 -uroot -p${{ secrets.CI_MYSQL_ROOT_PASSWORD }} -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='ats_migration_test';" 2>/dev/null)
          echo "迁移后表数量: $TABLE_COUNT"
          if [ "$TABLE_COUNT" -lt 50 ]; then
            echo "❌ 表数量 < 50, 迁移失败"
            exit 1
          fi
          echo "✅ 迁移验证通过"

      - name: Verify idempotency (re-run = no-op)
        working-directory: apps/django
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DATABASE_URL: mysql://root:${{ secrets.CI_MYSQL_ROOT_PASSWORD }}@127.0.0.1:3306/ats_migration_test
          DJANGO_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_MIGRATION }}
        run: |
          . .venv/bin/activate
          python manage.py migrate
          echo "✅ 二次 migrate 幂等性验证通过"

      # R3: 校验生产 settings 的启动期强校验真的会拦住错误配置。
      #     配置缺失时必须 ImproperlyConfigured 直接崩, 而不是静默回落到 dev。
      - name: Verify prod settings rejects unsafe config
        working-directory: apps/django
        run: |
          . .venv/bin/activate
          set +e
          DJANGO_SETTINGS_MODULE=config.settings.prod \
          DJANGO_SECRET_KEY=too-short \
          DJANGO_DEBUG=True \
          python manage.py check 2>/dev/null
          if [ $? -eq 0 ]; then
            echo "❌ prod settings 接受了不安全配置 (弱 SECRET_KEY + DEBUG=True), 启动期校验失效"
            exit 1
          fi
          echo "✅ prod settings 正确拒绝了不安全配置"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # R11: 原来 exit-code: '0' —— 扫出 CRITICAL 漏洞也返回成功, 纯装饰。
      #      改成 exit-code: '1' 真阻断。ignore-unfixed 保留: 上游还没出补丁的
      #      漏洞拦了也没法修, 拦它只会逼着大家加 skip。
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
