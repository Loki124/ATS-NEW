name: ATS CI

# R11 (2026-08-03 寇豆码): 这套 CI 之前是"看起来在跑, 实际拦不住任何东西":
#   1. 后端只跑 `pytest tests/` = 77/204 个用例, 62% 的测试 (apps/*/tests/) 从不执行
#   2. 前端用 `build:nocheck` 跳过 vue-tsc, 类型错误直接进主干
#   3. `npm run lint || true` —— lint 挂了也当过
#   4. Trivy `exit-code: '0'` —— 扫出 CRITICAL 漏洞也当过
#   本次把这 4 处全部收紧成真实门禁。

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        # 2026-09-27 P1-7: 与生产对齐为 MySQL 8.x —— mysql:9 与 8 在排序规则、
        # JSON 函数等行为上存在差异, CI 跑 9 而生产跑 8 会让"CI 绿、生产炸"。
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ats_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: |
            apps/django/requirements.txt
            apps/django/requirements-dev.txt

      - name: Install backend deps
        working-directory: apps/django
        run: |
          python -m venv .venv
          . .venv/bin/activate
          # R9: pytest / pytest-django / pytest-cov 现在锁在 requirements-dev.txt 里,
          #     不再像以前那样在 CI 里裸 `pip install pytest` 拉不确定版本。
          pip install -r requirements-dev.txt

      # R11: 原来是 `pytest tests/`, 只覆盖 77/204 个用例 —— apps/*/tests/ 下的
      #      127 个用例 (权限 V2、字段 ACL、状态机等核心逻辑) 在 CI 里从来没跑过。
      #      改成全量收集 (pytest.ini 的 testpaths = tests apps), 隔离区单独排除。
      - name: Lint (ruff)
        working-directory: apps/django
        run: |
          . .venv/bin/activate
          # 2026-10-08 (#27): Python lint 门禁。规则集见 apps/django/ruff.toml。
          #   阶段一聚焦 bug-catcher (F/E9/I), 非零即失败, 防"只许减少、不许新增"。
          ruff check apps

      # 2026-10-09 (#43): 技术债注释扫描。规范: TODO/FIXME/HACK/XXX 必须带 #issue 编号,
      #   否则不可审计、等于永久没人跟。当前 warn-only (报告但不阻断), 待存量裸标记补完
      #   编号后翻 --strict 成硬门禁 (与 ruff 同源: 只许减少、不许新增)。
      - name: Tech-debt TODO scan (warn-only)
        working-directory: apps/django
        run: |
          . .venv/bin/activate
          python scripts_scan_todo.py

      - name: Run tests (full suite, quarantine excluded)
        working-directory: apps/django
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          # 2026-10-08 (#26): 测试库对齐生产 MySQL 8 —— 复用上方 mysql:8.0 service,
          #   不再跑 SQLite (避免 "CI 绿、生产炸" 的排序规则/JSON 函数差异)。
          DB_ENGINE: mysql
          DB_NAME: ats_test
          DB_USER: root
          DB_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          # 2026-10-08: 后端覆盖率门禁 (见 #25)。低于此值 CI 失败。
          #   阈值保守设 70, 后续随补齐率提升再上调。
          COV_MIN: '70'
        run: |
          . .venv/bin/activate
          # 2026-10-08: 隔离名单不再由仓库级 QUARANTINE 变量承载 (不可审计),
          #   改为代码内 pytest marker: 给用例打 @pytest.mark.quarantine 即可隔离。
          #   tests/test_quarantine_guard.py 会守卫"名单里的用例是否仍真的失败"。
          #   .coveragerc 负责 source=apps 与排除 migrations/tests, 故这里只传 --cov=apps。
          pytest --tb=short -v --maxfail=10 -m "not quarantine" --cov=apps \
            --cov-report=term-missing --cov-fail-under=${{ env.COV_MIN }}

  test-frontend:
    name: Frontend Build + Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/app/package-lock.json

      - name: Install frontend deps
        working-directory: web/app
        run: npm ci

      # R10 + R11: 原来是 build:nocheck, 直接跳过 vue-tsc —— 类型检查等于没有。
      #   R10 已把仓库里那 3 个类型错误修掉, 这里恢复成带 vue-tsc 的正式 build。
      - name: Type check + Build
        working-directory: web/app
        run: npm run build

      # 2026-10-08 (#25): 前端覆盖率门禁。vitest.config.ts 里设了 thresholds,
      #   低于阈值本条直接失败。html 报告落 artifact 供复盘。
      - name: Unit tests (with coverage gate)
        working-directory: web/app
        run: npm test -- --coverage

      # R11: 原来是 `npm run lint || true`, 挂了也当过。
      #   现已确认全仓 eslint 零 error 零 warning, 直接收成硬门禁。
      #   用 lint:ci (不带 --fix): CI 里自动改文件会让"本地干净、CI 也绿, 但改动没提交"
      #   这种幽灵状态发生。
      - name: Lint
        working-directory: web/app
        run: npm run lint:ci

      # X-04 / X-05 / X-13 令牌强制门禁（AGENTS.md §6.2）。
      # 当前为 warn-only（.stylelintrc.json defaultSeverity=warning），不阻断合并；
      # 待存量硬编码色收敛后再翻 defaultSeverity=error 转硬门禁。
      - name: Style lint (warn-only)
        working-directory: web/app
        run: npm run lint:style

  brand-tokens:
    # R-214：品牌色令牌 MUST 由 brand-tokens.mjs 生成并纳入 CI 门禁。
    # 任一失败（彩度过低 / 对比度不达标 / 已提交文件过期）直接阻断合并。
    name: Brand Tokens Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/app/package-lock.json

      - name: Install frontend deps
        working-directory: web/app
        run: npm ci

      - name: Generate + gate brand tokens
        working-directory: web/app
        env:
          BRAND_COLOR: ${{ vars.BRAND_COLOR }}
        run: node brand-tokens.mjs --brand "${BRAND_COLOR:-#6366F1}" --ci --out src/styles/brand-tokens.css

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    services:
      mysql:
        # 2026-09-27 P1-7: 与生产对齐为 MySQL 8.x —— mysql:9 与 8 在排序规则、
        # JSON 函数等行为上存在差异, CI 跑 9 而生产跑 8 会让"CI 绿、生产炸"。
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ats_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache-dependency-path: apps/django/requirements.txt

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend deps
        working-directory: apps/django
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt

      - name: Start backend (SQLite for e2e)
        working-directory: apps/django
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DATABASE_URL: sqlite:///db.sqlite3
          DJANGO_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_E2E }}
          CORS_ALLOWED_ORIGINS: http://localhost:5212
        run: |
          . .venv/bin/activate
          python manage.py migrate
          nohup python -m gunicorn config.wsgi:application --bind 127.0.0.1:8000 > /tmp/e2e-backend.log 2>&1 &
          # R11: 原来是死等 sleep 5, 机器慢一点就连不上、报一堆假失败。
          #      改成轮询 /health/ 直到真的起来, 最多等 60s, 超时把日志打出来。
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health/ > /dev/null 2>&1; then
              echo "✅ backend 已就绪 (第 ${i} 次探测)"
              exit 0
            fi
            sleep 2
          done
          echo "❌ backend 60s 内未就绪, 日志如下:"
          cat /tmp/e2e-backend.log
          exit 1

      - name: Install frontend deps + build
        working-directory: web/app
        # build:fast 仅做 vite 打包 (不做 vue-tsc): 类型安全已由同一流水线前置的
        # test-frontend job (npm run build = vue-tsc && vite build) 保证。
        # 原 build:nocheck 逃生口已删除, 任何生产构建都必须走带类型检查的 build。
        run: |
          npm ci
          npm run build:fast

      - name: Install Playwright browsers
        working-directory: web/app
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: web/app
        env:
          CI: true
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/app/playwright-report/
          retention-days: 7

      - name: Upload backend log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-backend-log
          path: /tmp/e2e-backend.log
          retention-days: 7

  test-migrations:
    name: Test Migration Deploy
    runs-on: ubuntu-latest
    services:
      mysql:
        # 2026-09-27 P1-7: 与生产对齐为 MySQL 8.x —— mysql:9 与 8 在排序规则、
        # JSON 函数等行为上存在差异, CI 跑 9 而生产跑 8 会让"CI 绿、生产炸"。
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ats_migration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache-dependency-path: apps/django/requirements.txt

      - name: Install backend deps
        working-directory: apps/django
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt

      - name: Apply migrations (fresh DB)
        working-directory: apps/django
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DATABASE_URL: mysql://root:${{ secrets.CI_MYSQL_ROOT_PASSWORD }}@127.0.0.1:3306/ats_migration_test
          DJANGO_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_MIGRATION }}
        run: |
          . .venv/bin/activate
          python manage.py migrate
          TABLE_COUNT=$(mysql -h 127.0.0.1 -uroot -p${{ secrets.CI_MYSQL_ROOT_PASSWORD }} -N -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='ats_migration_test';" 2>/dev/null)
          echo "迁移后表数量: $TABLE_COUNT"
          if [ "$TABLE_COUNT" -lt 50 ]; then
            echo "❌ 表数量 < 50, 迁移失败"
            exit 1
          fi
          echo "✅ 迁移验证通过"

      - name: Verify idempotency (re-run = no-op)
        working-directory: apps/django
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          DATABASE_URL: mysql://root:${{ secrets.CI_MYSQL_ROOT_PASSWORD }}@127.0.0.1:3306/ats_migration_test
          DJANGO_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_MIGRATION }}
        run: |
          . .venv/bin/activate
          python manage.py migrate
          echo "✅ 二次 migrate 幂等性验证通过"

      # R3: 校验生产 settings 的启动期强校验真的会拦住错误配置。
      #     配置缺失时必须 ImproperlyConfigured 直接崩, 而不是静默回落到 dev。
      - name: Verify prod settings rejects unsafe config
        working-directory: apps/django
        run: |
          . .venv/bin/activate
          set +e
          DJANGO_SETTINGS_MODULE=config.settings.prod \
          DJANGO_SECRET_KEY=too-short \
          DJANGO_DEBUG=True \
          python manage.py check 2>/dev/null
          if [ $? -eq 0 ]; then
            echo "❌ prod settings 接受了不安全配置 (弱 SECRET_KEY + DEBUG=True), 启动期校验失效"
            exit 1
          fi
          echo "✅ prod settings 正确拒绝了不安全配置"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # R11: 原来 exit-code: '0' —— 扫出 CRITICAL 漏洞也返回成功, 纯装饰。
      #      改成 exit-code: '1' 真阻断。ignore-unfixed 保留: 上游还没出补丁的
      #      漏洞拦了也没法修, 拦它只会逼着大家加 skip。
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
